name: iOS TCP punch

on:
  push:
    paths:
      - 'apps/native/scripts/*tcp-punch*'
      - 'apps/native/plugins/withIosTcpPunch.cjs'
      - 'apps/native/plugins/withChatTransport.cjs'
      - 'apps/native/src/chat/connection.ts'
      - 'apps/native/src/chat/tcpNetwork*'
      - 'apps/native/e2e/tcp/IosTcpPunchChecks.m'
      - '.github/workflows/ios-tcp-punch.yml'
  pull_request:
    paths:
      - 'apps/native/scripts/*tcp-punch*'
      - 'apps/native/plugins/withIosTcpPunch.cjs'
      - 'apps/native/plugins/withChatTransport.cjs'
      - 'apps/native/src/chat/connection.ts'
      - 'apps/native/src/chat/tcpNetwork*'
      - 'apps/native/e2e/tcp/IosTcpPunchChecks.m'
      - '.github/workflows/ios-tcp-punch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port-sharing:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: node apps/native/scripts/test-ios-tcp-punch.cjs
