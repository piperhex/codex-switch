# Vendored from EasyTier ed73d318; workspace dependencies expanded without version changes.

[package]
"name" = "easytier-core"
"description" = "EasyTier OS-free control-plane core primitives."
"homepage" = "https://github.com/EasyTier/EasyTier"
"repository" = "https://github.com/EasyTier/EasyTier"
"version" = "2.7.0"
"edition" = "2024"
"rust-version" = "1.95"
"authors" = ["kkrainbow"]
"keywords" = ["vpn", "p2p", "network", "easytier"]
"categories" = ["network-programming"]
"license-file" = "LICENSE"
"metadata" = { "wasm-pack" = { "profile" = { "release" = { "wasm-opt" = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"] } } }, "cargo-machete" = { "ignored" = ["getrandom-02", "getrandom-03"] } }

[lib]
"crate-type" = ["rlib", "cdylib"]

[dependencies]
"anyhow" = { "version" = "1.0" }
"ariadne" = { "version" = "0.6", "optional" = true }
"arc-swap" = { "version" = "1.9" }
"async-ringbuf" = "0.3.9"
"async-trait" = { "version" = "0.1.92" }
"auto_impl" = { "version" = "1.3.0" }
"base64" = { "version" = "0.23" }
"bitflags" = "2.13"
"bytecodec" = { "version" = "0.5.0" }
"bytes" = { "version" = "1.12.1" }
"chrono" = { "version" = "0.4.45", "features" = ["clock"] }
"cidr" = { "version" = "0.3.2", "features" = ["serde"] }
"crossbeam" = { "version" = "0.8.5" }
"dashmap" = { "version" = "6.2.1" }
"bon" = { "version" = "3.10.1" }
"easytier-proto" = { "version" = "2.7.0", "default-features" = false, "features" = ["core"], "git" = "https://github.com/EasyTier/EasyTier", "rev" = "ed73d318bb3bf19601e227ab83dd61d66ce4b9f8" }
"futures" = { "version" = "0.3" }
"guarden" = { "version" = "0.3" }
"hmac" = { "version" = "0.13.0" }
"http-body-util" = { "version" = "0.1", "optional" = true }
"hyper" = { "version" = "1", "default-features" = false, "optional" = true, "features" = ["client", "http1"] }
"hyper-util" = { "version" = "0.1", "default-features" = false, "optional" = true, "features" = ["tokio"] }
"idna" = "1.1"
"atomic-shim" = { "version" = "0.2.0" }
"ordered_hash_map" = "0.6.1"
"parking_lot" = { "version" = "0.12.5" }
"percent-encoding" = { "version" = "2.3.2" }
"petgraph" = "0.8.3"
"pin-project-lite" = { "version" = "0.2.17" }
"prefix-trie" = { "version" = "0.10.1", "features" = ["cidr"] }
"prost" = { "version" = "0.14.4" }
"prost-types" = { "version" = "0.14.4" }
"rand" = { "version" = "0.8.8" }
"quanta" = { "version" = "0.12" }
"ring" = { "version" = "0.17", "optional" = true }
"rustls" = { "version" = "0.23.45", "default-features" = false, "optional" = true, "features" = ["ring", "std", "tls12"] }
"serde" = { "version" = "1.0.229", "features" = ["derive"] }
"serde_json" = { "version" = "1.0" }
"sha2" = { "version" = "0.11.0" }
"smoltcp" = { "version" = "0.14.0", "default-features" = false, "optional" = true }
"stun_codec" = { "version" = "0.4.0" }
"thiserror" = { "version" = "2.0" }
"tracing" = { "version" = "0.1" }
"strum" = { "version" = "0.28.0", "features" = ["derive"] }
"toml" = { "version" = "1.1.6" }
"tokio" = { "version" = "1.53", "default-features" = false, "features" = ["rt", "time", "sync", "macros", "io-util"] }
"tokio-util" = { "version" = "0.7.19", "features" = ["io", "rt"] }
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "optional" = true }
"url" = { "version" = "2.5", "features" = ["serde"] }
"wildmatch" = "2.6.1"
"uuid" = { "version" = "1.26.1", "features" = ["v4", "fast-rng", "serde"] }
"webpki-roots" = { "version" = "1.0", "optional" = true }
"x25519-dalek" = { "version" = "2.0.1", "features" = ["static_secrets"] }
"zerocopy" = { "version" = "0.7.35", "features" = ["derive", "simd"] }
"zstd" = { "version" = "0.14", "optional" = true }
"aes-gcm" = { "version" = "0.11.1", "optional" = true }
"chacha20poly1305" = { "version" = "0.11.0", "optional" = true }
"openssl" = { "version" = "0.10", "optional" = true, "features" = ["vendored"] }

[target]
"cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))" = { "dependencies" = { "getrandom-02" = { "package" = "getrandom", "version" = "0.2.17", "features" = ["js"] }, "getrandom-03" = { "package" = "getrandom", "version" = "0.3.4", "features" = ["wasm_js"] }, "snow" = { "version" = "0.10.0", "default-features" = false, "features" = ["default-resolver", "default-resolver-crypto"] }, "uuid" = { "version" = "1.26.1", "features" = ["js"] }, "wasm-bindgen" = "0.2" } }
"cfg(not(all(target_arch = \"wasm32\", target_os = \"unknown\")))" = { "dependencies" = { "snow" = "0.10.0" } }
"cfg(not(target_os = \"wasi\"))" = { "dev-dependencies" = { "tokio" = { "version" = "1.53", "default-features" = false, "features" = ["rt-multi-thread", "test-util"] } } }

[features]
"default" = ["aes-gcm", "endpoint-discovery", "extended-services", "management", "tcp-hole-punch"]
"aes-gcm" = ["dep:aes-gcm"]
"browser-config" = ["config-write", "easytier-proto/api", "easytier-proto/json-rpc"]
"chacha20" = ["dep:chacha20poly1305"]
"openssl-crypto" = ["dep:openssl"]
"ring-crypto" = ["dep:ring"]
"wasi-crypto-offload" = ["ring-crypto"]
"config-write" = []
"endpoint-discovery" = ["dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
"dhcp-ipv4" = []
"public-ipv6-provider" = []
"vpn-portal" = []
"wrapped-transport" = []
"extended-services" = ["dhcp-ipv4", "public-ipv6-provider", "vpn-portal", "wrapped-transport", "proxy-cidr-monitor"]
"web-client" = ["management-rpc", "config-write"]
"management" = ["web-client", "extended-services", "rich-config-errors", "easytier-proto/json-rpc"]
"management-rpc" = ["easytier-proto/api"]
"proxy-cidr-monitor" = []
"rich-config-errors" = ["dep:ariadne"]
"tcp-hole-punch" = []
"proxy-packet" = ["wrapped-transport", "dep:smoltcp", "smoltcp/std", "smoltcp/proto-ipv4", "smoltcp/proto-ipv4-fragmentation", "smoltcp/fragmentation-buffer-size-65536", "smoltcp/assembler-max-segment-count-16", "smoltcp/reassembly-buffer-size-65536", "smoltcp/reassembly-buffer-count-16"]
"proxy-smoltcp-stack" = ["proxy-packet", "smoltcp/medium-ip", "smoltcp/socket-tcp", "smoltcp/socket-udp", "smoltcp/proto-ipv6", "smoltcp/async"]
"wasm-host-tunnel" = []
"wasm-host-tunnel-outbound" = ["wasm-host-tunnel"]
"test-utils" = []
"tracing-log" = ["tracing/log"]
"zstd" = ["dep:zstd"]
