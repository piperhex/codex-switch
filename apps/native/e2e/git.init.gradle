// Keep Git verification separate from installed app data and real repositories.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.gittest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/GitFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'git-fixture.apk' }
        }
    }
}
