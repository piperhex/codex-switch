// Keep accounts and chat data in the installed production app untouched on physical devices.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.regressiontest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/ReleaseFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'release-fixture.apk' }
        }
    }
}
