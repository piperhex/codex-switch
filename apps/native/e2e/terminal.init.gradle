// Keep terminal verification separate from the user's installed app and data.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.terminaltest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/TerminalFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'terminal-fixture.apk' }
        }
    }
}
