// Install separately so physical-device checks preserve the user's app and conversations.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.imagepathtest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/ImagePathFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'image-path-fixture.apk' }
        }
    }
}
