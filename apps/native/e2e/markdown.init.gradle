// Keep rendering verification separate from the installed app and its data.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.markdowntest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/MarkdownFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'markdown-fixture.apk' }
        }
    }
}
