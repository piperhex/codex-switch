[package]
name = "csw-installer-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.10"
thiserror = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
strip = true
lto = true

