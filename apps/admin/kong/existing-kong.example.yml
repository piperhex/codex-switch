_format_version: "3.0"
_transform: true

# Import this into your existing Kong only if you use declarative config.
# For DB-backed Kong, use the Admin API commands in ../README.md instead.

services:
  - name: codex-switch-web
    url: http://codex-switch-web:80
    routes:
      - name: codex-switch-web
        paths:
          - /web
        strip_path: true

  - name: codex-switch-backend
    url: http://codex-switch-backend:8080
    routes:
      - name: codex-switch-public
        paths:
          - /auth
          - /admin
          - /feedback
          - /announcements
          - /notifications
          - /faqs
          - /telemetry
          - /device-switch
        strip_path: false
      - name: codex-switch-protected
        paths:
          - /sync
          - /admin/api
          - /devices
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              run_on_preflight: false
              claims_to_verify:
                - exp

consumers:
  - username: codex-switch-client
    jwt_secrets:
      - key: codex-switch
        # Replace this before importing; it must match backend KONG_JWT_SECRET.
        secret: REPLACE_WITH_A_RANDOM_SECRET
        algorithm: HS256
