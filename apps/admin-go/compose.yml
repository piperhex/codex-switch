services:
  admin-go:
    image: codex-switch/admin-go:local
    build:
      context: ../..
      dockerfile: apps/admin-go/Dockerfile
    env_file: .env
    environment:
      CHAT_STUN_PORT: "${CHAT_STUN_PORT:-3478}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "${ADMIN_GO_BIND:-127.0.0.1}:${ADMIN_GO_PORT:-8080}:8080"
      - "${ADMIN_GO_STUN_BIND:-0.0.0.0}:${ADMIN_GO_STUN_PORT:-3478}:${CHAT_STUN_PORT:-3478}/udp"
    networks:
      database:
      kong:
        aliases:
          - "${ADMIN_GO_KONG_ALIAS:-codex-switch-admin-go}"
networks:
  database:
    external: true
    name: ${ADMIN_GO_DB_NETWORK:-${ADMIN_GO_NETWORK:-admin_backend-internal}}
  kong:
    external: true
    name: ${ADMIN_GO_KONG_NETWORK:-kong-net}
