# Combine with the admin-go stack. Announce only private, operator-controlled discovery nodes.
services:
  admin-go:
    environment:
      CHAT_NATIVE_PEERS: "${CHAT_NATIVE_PEERS:?Set public udp:// and tcp:// discovery endpoints}"
      CHAT_NATIVE_STUN: "${CHAT_NATIVE_STUN:?Set at least two independent STUN endpoints}"
  chat-rendezvous:
    build:
      context: ../..
      dockerfile: apps/admin-go/Dockerfile.chat-connectivity
    image: codex-chat-connectivity:ed73d318
    restart: unless-stopped
    environment:
      CHAT_RENDEZVOUS_SECRET: "${CHAT_RENDEZVOUS_SECRET:?Set a separate random discovery-node secret}"
    ports:
      - "11010:11010/udp"
      - "11010:11010/tcp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
