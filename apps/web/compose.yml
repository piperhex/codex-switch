services:
  web:
    image: ${CODEX_WEB_IMAGE:-codex-switch/web:local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_WEB_BASE_PATH: ${VITE_WEB_BASE_PATH:-/web/}
    restart: unless-stopped
    networks:
      kong:
        aliases: [codex-switch-web]
networks:
  kong:
    external: true
    name: ${ADMIN_GO_KONG_NETWORK:-kong-net}
